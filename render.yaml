services:
  - type: web
    name: jubayer-ai-hunter-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/web_server.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false

  - type: worker
    name: jubayer-ai-hunter-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/main.py --bot
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: LLM_API_KEY
        sync: false
